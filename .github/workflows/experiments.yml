name: experiments

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Baseline
        run: python -m experiments.run_baseline
      - name: Transfer
        run: python -m experiments.run_transfer
      - name: Shift analysis
        run: python -m experiments.run_shift_analysis
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
